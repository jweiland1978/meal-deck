<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EF">
<meta name="description" content="High-protein meal cards, a weekly meal plan, a protein tracker, a meal builder, and a grocery list.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Deck">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Meal Deck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Meal Deck · Recomp Cookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --ink:#2A221D; --muted:#7A6D63; --line:#EADFD3;
  --accent:#D9573A; --accent-ink:#fff; --sage:#4F7D5C; --sage-soft:#E4EFE6;
  --skip:#C8463A; --save:#3E8E5A;
  --breakfast:#F2A93B; --lunch:#5E9C6E; --dinner:#D9573A; --snack:#8B5FA8;
  --radius:24px; --shadow:0 18px 40px -18px rgba(70,40,20,.35), 0 2px 6px rgba(70,40,20,.08);
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:radial-gradient(circle at 15% -10%, #FFE7CF 0, transparent 45%), radial-gradient(circle at 110% 20%, #E7F0E2 0, transparent 40%);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 0}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#F2A93B);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 14px -6px rgba(217,87,58,.7)}
.brand h1{font-family:var(--serif);font-size:22px;letter-spacing:-.3px;line-height:1}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:3px}
.counter{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.active{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* controls */
.controls{padding:6px 16px 0}
.seg{display:flex;background:#F1E8DD;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;white-space:nowrap;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(60,30,10,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.daynote{font-size:11.5px;color:var(--muted);padding:2px 4px 0}

/* stack */
.stack-wrap{flex:1;min-height:0;position:relative;margin:8px 16px 0}
.card{position:absolute;inset:0 0 14px;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;will-change:transform;perspective:1400px}
.card.pos-0{transform:none;z-index:3;cursor:grab}
.card.pos-0:active{cursor:grabbing}
.card.pos-1{transform:translateY(12px) scale(.955);z-index:2;opacity:.9;pointer-events:none}
.card.pos-2{transform:translateY(24px) scale(.91);z-index:1;opacity:.6;pointer-events:none}
.card .face>*{transition:opacity .3s}
.card.pos-1 .face>*,.card.pos-2 .face>*{opacity:0}
.card.entering{opacity:0;transform:translateY(34px) scale(.88)}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;border:1px solid rgba(0,0,0,.04)}
.back{transform:rotateY(180deg)}
.hero{position:relative;height:30%;min-height:118px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--tc) 0%, color-mix(in srgb,var(--tc) 55%, #fff) 100%)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.35),transparent 50%)}
.hero .emoji{font-size:64px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18));z-index:1}
.pill{position:absolute;z-index:2;top:14px;font-size:11.5px;font-weight:700;letter-spacing:.3px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink)}
.pill.type{left:14px;text-transform:uppercase}
.pill.time{right:14px}
.pill.day{left:14px;top:auto;bottom:12px;background:rgba(42,34,29,.78);color:#fff}
.front-body{flex:1;min-height:0;padding:16px 18px 12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
.front-body::-webkit-scrollbar{display:none}
.name{font-family:var(--serif);font-size:24px;line-height:1.15;letter-spacing:-.3px}
.why{font-size:14px;line-height:1.45;color:var(--muted)}
.macros{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;margin-top:2px}
.m{background:#FAF5EF;border-radius:14px;padding:8px 6px;text-align:center}
.m b{display:block;font-size:18px;font-weight:700;letter-spacing:-.3px}
.m span{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.m.kcal{background:#FFF0E6}.m.kcal b{color:var(--accent)}
.bar{display:flex;height:6px;border-radius:6px;overflow:hidden;background:#eee}
.bar i{display:block;height:100%}
.est{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sage-soft);color:var(--sage)}
.tag.t-train{background:#FFF0D6;color:#A86A06}.tag.t-rest{background:#E6EEF8;color:#3C6390}
.hint{margin-top:auto;font-size:12px;color:var(--muted);text-align:center;font-weight:500;opacity:.85}
.goalfit{font-size:12px;color:var(--sage);font-weight:600}
.back-head{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.back-head .emoji{font-size:28px}
.back-head h3{font-family:var(--serif);font-size:18px;line-height:1.2}
.back-head small{color:var(--muted);font-size:12px}
.back-body{flex:1;overflow-y:auto;padding:12px 18px 18px;-webkit-overflow-scrolling:touch}
.recipe h4{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);margin:12px 0 8px}
.recipe ul{list-style:none}
.recipe ul li{padding:7px 0 7px 22px;position:relative;font-size:14.5px;border-bottom:1px dashed var(--line)}
.recipe ul li::before{content:"";position:absolute;left:2px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--tc,#D9573A);opacity:.7}
.recipe ol{list-style:none;counter-reset:s}
.recipe ol li{counter-increment:s;position:relative;padding:6px 0 10px 36px;font-size:14.5px;line-height:1.45}
.recipe ol li::before{content:counter(s);position:absolute;left:0;top:4px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.recipe .why{margin-top:4px}
.stamp{position:absolute;top:28px;z-index:5;font-weight:800;font-size:26px;letter-spacing:2px;padding:6px 14px;border:4px solid;border-radius:12px;opacity:0;pointer-events:none;background:rgba(255,255,255,.85)}
.stamp.save{left:22px;color:var(--save);transform:rotate(-14deg)}
.stamp.skip{right:22px;color:var(--skip);transform:rotate(14deg)}

.actions{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 0 10px}
.fab{width:62px;height:62px;border-radius:50%;background:var(--surface);box-shadow:0 10px 22px -10px rgba(70,40,20,.45),0 1px 3px rgba(0,0,0,.08);display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px}
.fab.skip{color:var(--skip)} .fab.save{color:var(--save)}
.fab.small{width:46px;height:46px}.fab.small svg{width:20px;height:20px}
.fab.small{color:var(--muted)}
.fab[disabled]{opacity:.35;pointer-events:none}

.empty{position:absolute;inset:0 0 14px;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
.empty .big{font-size:56px}
.empty h3{font-family:var(--serif);font-size:22px}
.empty p{color:var(--muted);font-size:14px;line-height:1.5}
.btn{background:var(--accent);color:#fff;font-weight:700;padding:12px 20px;border-radius:14px;font-size:14px;box-shadow:0 8px 18px -10px rgba(217,87,58,.8)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}

/* lists / panels */
.scroll{flex:1;overflow-y:auto;padding:6px 16px 24px}
.section-title{font-family:var(--serif);font-size:26px;padding:6px 4px 2px}
.section-sub{color:var(--muted);font-size:13.5px;padding:0 4px 14px}
.fav{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 6px 16px -12px rgba(70,40,20,.5);border:1px solid rgba(0,0,0,.03);animation:fade .25s}
.fav .thumb{width:54px;height:54px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:28px;background:linear-gradient(140deg,var(--tc),color-mix(in srgb,var(--tc) 50%,#fff))}
.fav .info{flex:1;min-width:0;text-align:left}
.fav .info b{display:block;font-size:15px;line-height:1.25}
.fav .info small{color:var(--muted);font-size:12.5px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:#F6EEE6;color:var(--skip)}
.fav-filter{display:flex;gap:8px;overflow-x:auto;padding:0 2px 12px;scrollbar-width:none}
.panel{background:var(--surface);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 6px 16px -12px rgba(70,40,20,.5)}
.panel label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.field input{flex:1;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#FFFCF8;font-size:16px;outline:none;width:100%}
.field input:focus{border-color:var(--accent)}
.field span{color:var(--muted);font-size:13px;font-weight:600}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:0}
.stat span{color:var(--muted);font-size:13.5px}
.stat b{font-size:18px}
.stat b.hl{color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.disclaimer{font-size:11.5px;color:var(--muted);background:#F4ECE2;border-radius:12px;padding:10px 12px;line-height:1.45}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* grocery */
.gtop{display:flex;gap:8px;margin:0 0 12px}
.gtop .btn{flex:1;padding:11px 8px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.gtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.gtools .btn{padding:9px 12px;font-size:12.5px}
.gpanel-head{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.gpanel-head b{font-size:14px}
.gpanel-head span{font-size:12.5px;color:var(--muted);font-weight:600}
.gmeals{margin-top:10px}
.gmeal{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.gmeal.off .gm-name{opacity:.45}
.gm-check{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff;transition:.15s}
.gmeal:not(.off) .gm-check{background:var(--sage);border-color:var(--sage)}
.gm-name{flex:1;min-width:0;text-align:left;font-size:14px;font-weight:600;line-height:1.25;display:flex;gap:8px;align-items:center}
.gm-name small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.stepper{display:flex;align-items:center;background:#F6EEE6;border-radius:12px;flex:none}
.stepper button{width:32px;height:32px;font-size:18px;font-weight:700;color:var(--ink);border-radius:12px}
.stepper button:active{background:#EADFD3}
.stepper output{min-width:34px;text-align:center;font-weight:700;font-size:13.5px}
.gmeal.off .stepper{opacity:.4;pointer-events:none}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;font-size:13.5px;font-weight:600}
.switch-row small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.switch{width:46px;height:28px;border-radius:14px;background:#DDD2C6;position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--sage)}.switch.on::after{left:21px}
.gprog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);font-weight:600;margin:4px 2px 10px}
.gprog .track{flex:1;height:6px;border-radius:6px;background:#EDE3D8;overflow:hidden}
.gprog .track i{display:block;height:100%;background:var(--sage);transition:width .3s}
.gsec{background:var(--surface);border-radius:20px;padding:6px 14px 4px;margin-bottom:12px;box-shadow:0 6px 16px -12px rgba(70,40,20,.5)}
.gsec h4{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);padding:10px 0 6px;display:flex;justify-content:space-between}
.gsec h4 span{color:var(--muted);letter-spacing:0}
.gitem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 0;border-top:1px dashed var(--line);transition:opacity .2s}
.gitem .circ{width:22px;height:22px;flex:none;margin-top:1px;border-radius:50%;border:2px solid #D6C8BA;display:grid;place-items:center;color:#fff;font-size:12px;transition:.15s}
.gitem .gt{flex:1;min-width:0}
.gitem .gn{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:600}
.gitem .gq{font-weight:700;color:var(--ink);text-align:right;flex:none;max-width:55%}
.gitem .gfor{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.gitem.done{opacity:.5}
.gitem.done .circ{background:var(--sage);border-color:var(--sage)}
.gitem.done .gn span:first-child,.gitem.done .gq{text-decoration:line-through}
.gnote{font-size:11.5px;color:var(--muted);line-height:1.45;padding:2px 4px 8px}
.linkish{color:var(--accent);font-weight:700;text-decoration:underline;font-size:12.5px}
.fav-cta{width:100%;margin-bottom:12px}

/* nav */
nav{display:flex;justify-content:space-around;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 8px;min-width:68px;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
.badge{position:absolute;top:0;right:12px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,20,12,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex;animation:fadeBg .2s}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:90dvh;border-radius:26px 26px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .hero{height:150px;flex:none}
.sheet .close{position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:18px}
.sheet .content{overflow-y:auto;padding:16px 20px calc(24px + env(safe-area-inset-bottom))}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (min-height:820px){.name{font-size:26px}}
@media (max-width:370px){.seg button{font-size:12px;padding:9px 4px}.est span:last-child{display:none}}
@media (max-height:700px){.hero{min-height:96px}.hero .emoji{font-size:48px}.why{font-size:13px}.fab{width:54px;height:54px}.front-body{gap:8px;padding:12px 16px 10px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ===== v2 additions ===== */
.hdr-r{display:flex;align-items:center;gap:6px}
.genbtn{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),#F2A93B);padding:7px 11px;border-radius:999px;box-shadow:0 6px 14px -8px rgba(217,87,58,.8);white-space:nowrap}
.sheet{position:relative}
.sheet-pad{padding-top:22px!important}
.sheet-title{font-family:var(--serif);font-size:22px;margin:0 44px 10px 0}
.sheet .content>.close{background:#F4ECE2}
.chip.ing{border-style:dashed}
.chip.on-ing{background:var(--sage-soft);border-color:var(--sage);color:var(--sage)}
#ingPanel{padding:4px 2px 2px}
.ingform{display:flex;gap:8px}
.ingform input{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FFFCF8;font-size:16px;outline:none}
.ingform input:focus{border-color:var(--sage)}
.ingform .btn{padding:10px 14px;background:var(--sage);box-shadow:none}
.incl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px}
.incl .chip{background:var(--sage);border-color:var(--sage);padding:5px 11px}
.ingchips{padding-top:8px}
.ingchips .chip{padding:5px 11px;font-size:12.5px}
.wrapchips{display:flex;flex-wrap:wrap;gap:6px}
.wrapchips .chip{padding:6px 11px;font-size:12.5px}
.tag.t-gen{background:#FDE8F0;color:#A0336A}
.pill.cooked{right:14px;top:auto;bottom:12px;background:rgba(255,255,255,.92)}
.actrow{display:flex;gap:6px;margin:4px 0 10px}
.act{flex:1;padding:9px 4px;border-radius:12px;background:#F6EEE6;font-size:12.5px;font-weight:700;white-space:nowrap}
.act:active{background:#EADFD3}
.rbadge{font-size:12.5px;font-weight:600;color:#A86A06;margin:-2px 0 8px}
.scaler{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;flex-wrap:wrap}
.switch-row.mini{width:auto;margin-left:auto;gap:8px;font-size:12.5px}
.switch-row.mini .switch{width:40px;height:24px}.switch-row.mini .switch::after{width:18px;height:18px}.switch-row.mini .switch.on::after{left:19px}
.scal-note{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.scal-note b{color:var(--ink)}
.batchbox{margin-top:12px;background:#F0F6F1;border-radius:16px;padding:4px 14px 14px}
.batchbox h4{color:var(--sage)!important}
.batchbox ul li{font-size:13px!important}
.batchbox ul li::before{background:var(--sage)!important}
.btn.sm{padding:8px 12px;font-size:12.5px}
.seg.small button{font-size:12.5px;padding:8px 4px}
.glabel{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px}
/* plan */
.plan-head{display:flex;align-items:center;justify-content:space-between}
.pset{padding:14px 16px}
.pset-body{margin-top:10px}
.pset-body label{margin-top:6px}
.daychips{display:flex;gap:5px;margin-bottom:10px}
.daychips .chip{flex:1;padding:7px 0;font-size:12px;text-align:center}
.dstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 0 10px}
.dpill{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 9px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-size:12px;position:relative;overflow:hidden}
.dpill span{font-size:13px}
.dpill i{position:absolute;left:0;bottom:0;height:3px;width:var(--w);background:var(--sage)}
.dpill.today b{color:var(--accent)}
.dpill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dpill.on.today b{color:#FFC7B5}
.dayc{background:var(--surface);border-radius:20px;padding:14px 14px 8px;margin-bottom:12px;box-shadow:0 6px 16px -12px rgba(70,40,20,.5)}
.dayc-head h3{font-family:var(--serif);font-size:21px}
.dtype{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:4px}
.dtype.t{background:#FFF0D6;color:#A86A06}.dtype.r{background:#E6EEF8;color:#3C6390}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}
.totals>div span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.totals>div b{display:block;font-size:19px;margin:1px 0 4px}
.totals b small{font-size:12px;color:var(--muted);font-weight:600}
.tsub{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.ptrack{display:block;height:7px;border-radius:7px;background:#EDE3D8;overflow:hidden}
.ptrack i{display:block;height:100%;border-radius:7px;background:var(--sage);transition:width .3s}
.ptrack.k i{background:var(--breakfast)}
.slot{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px dashed var(--line);position:relative}
.slot-type{position:absolute;top:6px;left:50px;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--tc,var(--muted))}
.slot-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left}
.slot-main b{display:block;font-size:14px;line-height:1.25;margin-top:9px}
.slot-main small{font-size:11.5px;color:var(--muted)}
.slot-main em{font-style:normal;font-weight:800;color:var(--accent)}
.slot-emoji{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(140deg,var(--tc),color-mix(in srgb,var(--tc) 50%,#fff))}
.slot-btns{display:flex;gap:2px;flex:none}
.sbtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:14px;background:#F6EEE6}
.sbtn.on{background:#FFE9B8}
.slot.locked .slot-emoji{box-shadow:0 0 0 2px #E7B44B}
.addons{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 6px;border-top:1px dashed var(--line);align-items:center}
.addon-h{font-size:11.5px;font-weight:700;color:var(--muted);width:100%}
.addon{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;background:#FFF5E6;color:#8A5A0A;border-radius:999px;padding:5px 6px 5px 11px}
.addon small{font-weight:500;opacity:.8}
.addon button{width:20px;height:20px;border-radius:50%;font-size:10px;background:rgba(0,0,0,.06)}
.plan-note{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:6px}
/* add to plan */
.act.plan-act{width:100%;flex:none;margin:-4px 0 10px;background:var(--sage-soft);color:var(--sage)}
.dpill.off{opacity:.4;border-style:dashed;background:transparent}
.dpill.off i{display:none}
.dpill.off.on{opacity:.75;background:var(--ink)}
.slot.slotempty .slot-emoji{background:#F4ECE2;color:var(--muted);font-size:20px;font-weight:700}
.slot.slotempty .slot-main b{color:var(--muted)}
.slot.picked .slot-type::after{content:" · picked";color:var(--muted);font-weight:700}
.plan-tools{display:flex;gap:8px;margin:0 0 12px}
.plan-tools .btn{flex:1;padding:9px 8px;font-size:12.5px}
.pdays{padding:12px 14px 4px}
.pdays .glabel{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.pdays .glabel button{font-size:11.5px;font-weight:700;color:var(--accent);text-transform:none;letter-spacing:0}
.pick-note{font-size:12.5px;line-height:1.4;background:#FFF5E6;color:#8A5A0A;border-radius:12px;padding:9px 11px;margin:8px 0}
.pick-note.info{background:var(--sage-soft);color:var(--sage)}
.pick-days .chip{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.pick-days .chip small{font-size:11px}
.pick-list{display:flex;flex-direction:column;margin-top:6px}
.pick-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px dashed var(--line);text-align:left;width:100%}
.pick-row .slot-emoji{width:38px;height:38px;font-size:20px}
.pick-row b{display:block;font-size:13.5px;line-height:1.25}
.pick-row small{font-size:11.5px;color:var(--muted)}
.pick-search{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;background:var(--surface);margin:4px 0 6px}
.how{padding-left:20px;font-size:14px;line-height:1.5}.how li{margin:4px 0}
.off-banner{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* tracker */
.trk{display:flex;align-items:center;gap:16px}
.ringwrap{position:relative;width:128px;height:128px;flex:none}
.ring{width:128px;height:128px}
.ring circle{fill:none;stroke-width:12}
.ring-bg{stroke:#EFE6DB}
.ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-fg.done{stroke:var(--sage)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font-family:var(--serif);font-size:30px;line-height:1}
.ringtxt span{font-size:11px;color:var(--muted);font-weight:600;max-width:80px;line-height:1.25;margin-top:3px}
.trk-side{flex:1;min-width:0}
.trk-left{font-size:15px;margin-bottom:10px}
.trk-left b{color:var(--accent)}
.kline{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.kline b{font-size:15px;color:var(--ink)}.kline small{color:var(--muted);font-size:11.5px}
.dtag{display:block;font-size:11px;color:var(--muted);margin-top:6px}
.qform{display:flex;flex-direction:column;gap:8px}
.qform>input{padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FFFCF8;font-size:16px;outline:none}
.qnums{display:flex;gap:8px}
.field.sm{flex:1;margin:0}.field.sm input{padding:10px;min-width:0}.field.sm span{font-size:11.5px;white-space:nowrap}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.panel label+.qrow{border-top:0}
.qrow.done .qn{opacity:.55}
.qe{font-size:22px;width:30px;text-align:center;flex:none}
.qn{flex:1;min-width:0}
.qn b{display:block;font-size:13.5px;line-height:1.25}
.qn small{font-size:11.5px;color:var(--muted)}
.icon-btn.sm{width:30px;height:30px;font-size:13px}
.hist{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:130px;padding-top:16px;align-items:end}
.hbar{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:18px}
.hbar i{display:block;width:70%;max-width:30px;border-radius:7px 7px 3px 3px;background:#E9D9C8;min-height:2px}
.hbar.hit i{background:var(--sage)}
.hbar.today i{outline:2px solid var(--accent);outline-offset:1px}
.hbar small{position:absolute;bottom:0;font-size:10.5px;color:var(--muted);font-weight:600}
.hv{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:2px}
.tline{position:absolute;left:0;right:0;bottom:calc(18px + (100% - 34px) * var(--tl) / 100%);border-top:1.5px dashed var(--accent);opacity:.6;pointer-events:none}
.tline em{position:absolute;right:0;top:-15px;font-size:9.5px;font-style:normal;font-weight:700;color:var(--accent)}
/* ate / cooked sheets */
.ate-meal{display:flex;align-items:center;gap:12px;background:#FAF5EF;border-radius:16px;padding:12px;margin-bottom:14px}
.ate-meal b{display:block;font-size:15px;line-height:1.25}.ate-meal small{color:var(--muted);font-size:12px}
.emoji-lg{font-size:34px}
.ate-sum{text-align:center;margin:14px 0;font-size:15px}
.ate-sum small{color:var(--muted)}
.thumbs{display:flex;gap:8px;margin-bottom:12px}
.thumb{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.thumb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stars{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.star{font-size:34px;color:#E2D6C9;line-height:1;padding:2px}
.star.on{color:#F2A93B}
/* generator */
.genres{border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
.genhero{position:relative;height:120px;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#fff))}
.genhero .emoji{font-size:56px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18))}
.genbody{padding:14px 16px}
.genbody .name{font-size:22px;margin-bottom:6px}
.genbody .why{margin-bottom:10px}
.genbody .recipe ul li,.genbody .recipe ol li{font-size:13.5px}
/* me */
.me-top{padding:6px 16px 4px}
.me-top .seg{margin-top:4px}
@media (max-width:370px){.genbtn{padding:6px 9px;font-size:11px}.brand small{display:none}}
.card.flipped .front,.card:not(.flipped) .back{pointer-events:none}
.brand{min-width:0}.brand>div{min-width:0}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{white-space:nowrap}
header{gap:8px}
.kcards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.kcard{border-radius:14px;padding:9px 6px;text-align:center;background:#FAF5EF}
.kcard span{display:block;font-size:10.5px;font-weight:700;color:var(--muted)}
.kcard b{display:block;font-size:19px;letter-spacing:-.3px;margin-top:2px}
.kcard small{font-size:10.5px;color:var(--muted)}
.kcard.t{background:#FFF0D6}.kcard.r{background:#E6EEF8}.kcard.p{background:#E4EFE6}
.muted{color:var(--muted)}
#modeSeg button{font-size:12px}
.stat b{white-space:nowrap}.stat{gap:10px}
.tag.t-spicy{background:#FDE3DC;color:#B4321C}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">🍽️</div><div><h1>Meal Deck</h1><small>High-protein ideas for lean gains</small></div></div>
    <div class="hdr-r" id="hdrDeck"><button class="genbtn" id="genBtn" title="Build me a new meal">✨ New meal</button><div class="counter" id="counter">–</div></div>
  </header>
  <main>
    <!-- DECK -->
    <section class="view active" id="view-deck">
      <div class="controls">
        <div class="seg" id="daySeg" role="tablist" aria-label="Day type">
          <button data-day="train">💪 Training day</button>
          <button data-day="rest">🧘 Rest day</button>
          <button data-day="all">All</button>
        </div>
        <div class="chips" id="typeChips"></div>
        <div id="ingPanel" hidden></div>
      </div>
      <div class="stack-wrap" id="stack" aria-live="polite"></div>
      <div class="actions">
        <button class="fab small" id="undoBtn" title="Undo (U)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="fab skip" id="skipBtn" title="Skip (←)" aria-label="Skip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button class="fab save" id="saveBtn" title="Save (→)" aria-label="Save to favorites"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 2.9 4.5 6.6 4.5c2.1 0 3.6 1.1 4.4 2.5h2c.8-1.4 2.3-2.5 4.4-2.5 3.7 0 5.8 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
        <button class="fab small" id="flipBtn" title="Full recipe (Space)" aria-label="Show full recipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2zm0 0A2 2 0 0 0 6 22h13"/><path d="M9 8h6M9 12h4"/></svg></button>
        <button class="fab small" id="planBtn" title="Add to plan" aria-label="Add to plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg></button>
      </div>
    </section>

    <!-- PLAN -->
    <section class="view" id="view-plan">
      <div class="scroll" id="planScroll"><div id="planBody"></div></div>
    </section>

    <!-- GROCERY -->
    <section class="view" id="view-grocery">
      <div class="scroll" id="grocScroll">
        <h2 class="section-title">Grocery list</h2>
        <p class="section-sub">Made from your saved meals, your weekly plan, and recipes you add. Tap an item to check it off.</p>
        <div id="grocBody"></div>
      </div>
    </section>

    <!-- ME -->
    <section class="view" id="view-me">
      <div class="me-top">
        <div class="seg" id="meSeg"><button data-me="tracker" class="on">📈 Tracker</button><button data-me="favs">♥ Favorites</button><button data-me="goals">🎯 Goals</button></div>
      </div>
      <div class="scroll" id="meScroll" style="padding-top:12px"><div id="meBody"></div></div>
    </section>
  </main>
  <nav>
    <button data-view="deck" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M2 7v10M22 7v10" stroke-linecap="round"/></svg>Deck</button>
    <button data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M7.5 14h3M13.5 14h3M7.5 17.5h3"/></svg>Plan</button>
    <button data-view="grocery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.8l2-8H6.6"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Grocery</button>
    <button data-view="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>Me<span class="badge" id="favBadge" title="Favorites"></span></button>
  </nav>
</div>

<div class="modal" id="modal" aria-hidden="true"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===================== MEAL DATA =====================
 * Add a meal by copying any object below. Fields:
 *  id (unique), type: Breakfast|Lunch|Dinner|Snack, emoji, name, why,
 *  kcal, p (protein g), c (carbs g), f (fat g)  -> estimates per serving

/* ---------- amounts & units ---------- */
const VOL = {tsp:1, tbsp:3, cup:48};

function fmtNum(x, fracs){
  const FR = {0:"",0.125:"⅛",0.25:"¼",0.333:"⅓",0.5:"½",0.667:"⅔",0.75:"¾"};
  let w = Math.floor(x + 1e-9), r = x - w, best = 0;
  [...fracs, 1].forEach(f => { if (Math.abs(r - f) < Math.abs(r - best)) best = f; });
  if (best === 1){ w += 1; best = 0; }
  if (w === 0 && best === 0) best = fracs.find(f => f > 0);
  const key = Object.keys(FR).find(k => Math.abs(k - best) < 0.01);
  return (w ? String(w) : "") + FR[key];
}
function fmtVol(t){
  const cq = t / 48, clean = [0.25, 1/3, 2/3, 0.75].some(f => Math.abs(cq - f) < 0.01);
  if (t >= 23.9 || (t >= 11.9 && clean)){ const c = t / 48; return `${fmtNum(c, [0,.125,.25,.333,.5,.667,.75])} ${c > 1.01 ? "cups" : "cup"}`; }
  if (t >= 2.99) return `${fmtNum(t / 3, [0,.333,.5,.667])} tbsp`;
  return `${fmtNum(t, [0,.25,.333,.5,.667,.75])} tsp`;
}
function fmtWt(oz){
  if (oz >= 16){ const lb = oz / 16, s = `${fmtNum(lb, [0,.25,.5,.75])} lb`; return Math.abs(Math.round(lb * 4) / 4 - lb) > 0.01 ? `${s} (${+oz.toFixed(1)} oz)` : s; }

}
function fmtCount(n, u, roundUp){
  const q = roundUp ? Math.ceil(n * 4 - 1e-6) / 4 : n;
  const s = fmtNum(q, [0,.25,.333,.5,.667,.75]);
  return u ? `${s} ${q > 1 ? (PLURAL[u] || u + "s") : u}` : s;
}
function fmtAmt(q, u){

}

function displayName(name, qty){
  let n = name, cooked = false;
  if (/\(cooked\)$/.test(n)){ n = n.replace(/\s*\(cooked\)$/, ""); cooked = true; }
  const lc1 = x => PROPER.test(x) ? x : x.charAt(0).toLowerCase() + x.slice(1);
  const i = n.indexOf(", ");
  if (i > 0) n = n.slice(i + 2) + " " + lc1(n.slice(0, i));
  n = lc1(n);
  if (cooked) n = "cooked " + n;
  if (qty != null){
    if (qty <= 1 && /[^s]s$/.test(n) && !/(ss|us|is)$/.test(n)) n = n.replace(/s$/, "");
    else if (qty > 1 && !/s$/.test(n) && !/\)$/.test(n)) n = /o$/.test(n) ? n + "es" : n + "s";

}
function ingText(q, u, name, note){

  const countish = !VOL[u] && !WT[u] && !u;
  return `${fmtAmt(q, u)} ${displayName(name, countish ? q : null)}${note ? `, ${note}` : ""}`;
}

const FOOD_KEY = {}; Object.entries(FOOD).forEach(([k, v]) => FOOD_KEY[v[0]] = k);
function conv(q, u, bu){
  if (u === bu) return q;
  if (VOL[u] && VOL[bu]) return q * VOL[u] / VOL[bu];
  if (WT[u] && WT[bu]) return q * WT[u] / WT[bu];
  return null;
}
function macrosOf(entries){   // entries: [key, qty, unit]
  let k = 0, p = 0, c = 0, f = 0;
  entries.forEach(([key, q, u]) => {
    const F = FOOD[key]; if (!F || q == null) return;
    const x = conv(q, (u == null || u === "") ? F[2] : u, F[2]); if (x == null) return;
    k += F[3] * x; p += F[4] * x; c += F[5] * x; f += F[6] * x;
  });
  return {kcal: Math.round(k), p: Math.round(p), c: Math.round(c), f: Math.round(f)};
}

  const m = Object.assign({}, src);

    const F = FOOD[key]; const unit = (u == null || u === "") ? F[2] : u;
    return [ingText(q, unit, F[0], note), [q == null ? null : q, unit, F[0], F[1]]];

const EXCL = {
  fish:{label:"No fish", re:/salmon|\bcod\b|tilapia|tuna|sardine|trout|halibut/},
  shellfish:{label:"No shellfish", re:/shrimp|crab|scallop|lobster/},

function tokRe(tok){
  let t = tok.toLowerCase().trim().replace(/[^a-z0-9 %-]/g, "");
  if (!t) return null;
  if (/^(rice|real rice)$/.test(t)) return /\b(brown|jasmine|basmati|wild|white) rice\b/;
  if (/^(beef|red meat)$/.test(t)) return /\bbeef\b|steak|sirloin|flank|top round|jerky/;
  if (/^steaks?$/.test(t)) return /steak|sirloin|flank|top round/;
  if (/^(hamburger|burger meat|minced beef)$/.test(t)) return /ground beef/;
  t = t.replace(/oes$/, "o").replace(/ies$/, "y").replace(/([^s])s$/, "$1");
  const core = /y$/.test(t) ? `${t.slice(0,-1)}(y|ies)` : `${t}(e?s)?`;
  return new RegExp(`\\b${core}\\b`);
}
const avoidTokens = () => filters.avoid.split(",").map(s => s.trim()).filter(Boolean);
function nameExcluded(n){
  n = n.toLowerCase();
  if (filters.exclude.some(c => EXCL[c] && EXCL[c].re.test(n))) return true;
  return avoidTokens().some(t => { const re = tokRe(t); return re && re.test(n); });
}

/* ---------- ratings & similarity weighting ---------- */
const STAR_W = {1:0.15, 2:0.4, 3:1, 4:1.8, 5:2.5};
let weightCache = null;
function weightFor(m){
  if (!weightCache){
    weightCache = {};
    const liked = [], disliked = [];
    Object.entries(ratings).forEach(([id, r]) => { const x = byId[id]; if (!x || !r.stars) return; if (r.stars >= 4) liked.push(x); else if (r.stars <= 2) disliked.push(x); });
    ALLM.forEach(x => {
      let w = 1; const r = ratings[x.id];
      if (r && r.stars) w *= STAR_W[r.stars];
      else {
        liked.forEach(l => { if (l._protein === x._protein) w *= 1.15; if (l.tags.filter(t => x.tags.includes(t)).length >= 2) w *= 1.08; });
        disliked.forEach(d => { if (d._protein === x._protein) w *= 0.85; });
      }
      weightCache[x.id] = Math.max(0.05, Math.min(w, 4));
    });
  }
  return weightCache[m.id] ?? 1;
}

  bulk:  {label:"💪 Lean bulk",      short:"Lean bulk",       train:350,  rest:150,  note:"About 250 kcal over maintenance on average (more on training days), for slow muscle gain with little fat."}

function ratingBadge(m){
  const r = ratings[m.id]; if (!r || (!r.cooked && !r.stars)) return "";
  return `${r.cooked ? `👨‍🍳 Cooked ${r.cooked}×` : ""}${r.cooked && r.stars ? " · " : ""}${r.stars ? `${"★".repeat(r.stars)}` : ""}`;
}
function macroBlock(m){
  const pc = m.p * 4, cc = m.c * 4, fc = m.f * 9, tot = pc + cc + fc || 1;
  return `<div class="macros">
      <div class="m kcal"><b>${m.kcal}</b><span>kcal</span></div>
      <div class="m"><b>${m.p}g</b><span>Protein</span></div>
      <div class="m"><b>${m.c}g</b><span>Carbs</span></div>
      <div class="m"><b>${m.f}g</b><span>Fat</span></div>
    </div>
    <div class="bar" title="Calories from protein / carbs / fat">
      <i style="width:${pc/tot*100}%;background:var(--sage)"></i><i style="width:${cc/tot*100}%;background:var(--breakfast)"></i><i style="width:${fc/tot*100}%;background:var(--accent)"></i>
    </div>
    <div class="est"><span>Estimated · per serving</span><span>${Math.round(pc/tot*100)}% protein · ${Math.round(cc/tot*100)}% carbs · ${Math.round(fc/tot*100)}% fat</span></div>`;
}
function goalFit(m){
  const t = targets(); if (!t.set) return "";
  return `<div class="goalfit">✓ About ${Math.round(m.p / t.p * 100)}% of your daily protein target</div>`;
}
const tagHtml = m => `<div class="tags">${tagsFor(m).map(([t,c]) => `<span class="tag ${c}">${esc(t)}</span>`).join("")}</div>`;

/* ---------- recipe block: scaler, batch prep, actions ---------- */
const rsState = {};
const rsGet = id => rsState[id] || (rsState[id] = {n:1, batch:false});
function storageTips(m){
  const n = m._all.join(" "), tips = [];
  const fish = /salmon|\bcod\b|tilapia|tuna|shrimp/.test(n);
  if (m.tags.includes("no cook") && m.type !== "Lunch") tips.push("Assemble in jars or containers, and add crunchy toppings (granola, nuts) right before eating so they stay crisp.");
  if (m.tags.includes("freezer friendly")) tips.push("Freezes well. Portion and freeze for up to 3 months, then thaw overnight in the fridge.");
  if (fish) tips.push("Seafood is best within 2 days. Cook enough for 2 days, or keep raw portions frozen and cook as needed.");
  else tips.push("Refrigerate in airtight containers for up to 4 days. Reheat to 165°F (about 90 seconds in the microwave, stirring halfway).");
  if (/salad|slaw|lettuce|wrap/i.test(m.name)) tips.push("Keep dressing or sauce in a separate small container until you eat it.");
  if (/rice|quinoa|farro|potato|pasta/.test(n)) tips.push("Cook the grains or potatoes in one big batch and spread them out to cool before portioning.");
  tips.push("Use the same containers for every portion. Label them with the date.");
  return tips;
}
function scaledLines(m, k){
  const out = [];
  m.ing.forEach(line => {
    const items = line.slice(1);
    if (!items.length) return;
    out.push(items.map(([q, u, name]) => q == null ? ingText(null, u, name) + " (to taste)" : ingText(q * k, u, name)).join(" + "));
  });
  return out;
}
function recipeHtml(m){
  const s = rsGet(m.id), k = s.n;
  const lines = k === 1 && !s.batch ? m.ing.map(i => i[0]) : scaledLines(m, k);
  return `<div class="recipe-wrap" data-mid="${m.id}"><div class="recipe">
    <div class="actrow">
      <button class="act" data-act="ate" data-id="${m.id}">✓ Ate this</button>
      <button class="act" data-act="cooked" data-id="${m.id}">👨‍🍳 Cooked it</button>
      <button class="act" data-act="groc" data-id="${m.id}">🛒 Add ${k}</button>
    </div>
    <button class="act plan-act" data-act="plan" data-id="${m.id}">📅 Add to plan</button>
    ${ratingBadge(m) ? `<div class="rbadge">${ratingBadge(m)}</div>` : ""}
    <div class="scaler">
      <span>Servings</span>
      <div class="stepper"><button data-act="rs-" data-id="${m.id}" aria-label="Fewer servings">−</button><output>${k}</output><button data-act="rs+" data-id="${m.id}" aria-label="More servings">+</button></div>
      <button class="switch-row mini" data-act="rsb" data-id="${m.id}"><span>Batch prep</span><span class="switch ${s.batch ? "on" : ""}"></span></button>
    </div>
    <p class="scal-note">Per serving (est.): ${m.kcal} kcal · ${m.p}g protein · ${m.c}g carbs · ${m.f}g fat${k > 1 ? `<br><b>Total for ${k}: ${Math.round(m.kcal * k).toLocaleString()} kcal · ${m.p * k}g protein</b>` : ""}</p>
    <h4>Ingredients · ${k === 1 ? "1 serving" : `${k} servings`}</h4><ul>${lines.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    <h4>Steps</h4><ol>${m.steps.map(st => `<li>${esc(st)}</li>`).join("")}</ol>
    ${s.batch ? `<div class="batchbox"><h4>📦 Batch prep for ${k}</h4><ul>${storageTips(m).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <button class="btn" data-act="groc" data-id="${m.id}" style="width:100%;margin-top:8px">🛒 Put ${k} servings on the grocery list</button></div>` : ""}
  </div></div>`;
}
function refreshRecipes(id){
  document.querySelectorAll(`.recipe-wrap[data-mid="${id}"]`).forEach(w => { w.outerHTML = recipeHtml(byId[id]); });
}

function makeCard(m){
  const el = document.createElement("div");
  el.className = "card";

        <div class="front-body">
          <h2 class="name">${esc(m.name)}</h2>

        <div class="back-body">${recipeHtml(m)}<div class="hint" style="margin-top:14px">Tap to flip back ↻</div></div>
      </div>
    </div>`;
  attachDrag(el);
  return el;
}

/* ---------- deck ---------- */
function matches(m){
  if (prefs.type !== "All" && m.type !== prefs.type) return false;
  if (prefs.day === "train" && m.day === "rest") return false;
  if (prefs.day === "rest" && m.day === "train") return false;
  if (isExcluded(m)) return false;
  return includeMatch(m);
}
const poolSize = () => ALLM.filter(matches).length;
function buildDeck(){
  weightCache = null;
  deck = weightedShuffle(ALLM.filter(m => matches(m) && !favs.includes(m.id) && !skipped.includes(m.id)).map(m => m.id));
  ensureDeck();
}
function ensureDeck(){
  if (deck.length) return;
  const sk = ALLM.filter(m => matches(m) && skipped.includes(m.id) && !favs.includes(m.id)).map(m => m.id);
  if (!sk.length) return;
  skipped = skipped.filter(id => !sk.includes(id));
  deck = weightedShuffle(sk);
  persist();
  toast("🔄 That's the whole deck! Reshuffling the meals you skipped.");
}
const stack = $("#stack");
function renderStack(reset){
  if (reset) stack.innerHTML = "";
  const top = deck.slice(0, 3);
  stack.querySelectorAll(".card:not(.leaving)").forEach(el => { if (!top.includes(el.dataset.id)) el.remove(); });
  const old = stack.querySelector(".empty"); if (old) old.remove();
  top.forEach((id, i) => {
    let el = stack.querySelector(`.card[data-id="${id}"]:not(.leaving)`);
    if (!el){
      el = makeCard(byId[id]);
      el.classList.add("entering");
      stack.appendChild(el);
      void el.offsetWidth;
      el.classList.remove("entering");
    }
    el.classList.remove("pos-0","pos-1","pos-2");
    el.classList.add("pos-" + i);
    el.setAttribute("aria-hidden", i ? "true" : "false");
  });
  if (!top.length) renderEmpty();
  $("#skipBtn").disabled = $("#saveBtn").disabled = $("#flipBtn").disabled = $("#planBtn").disabled = !top.length;
  $("#undoBtn").disabled = !history.length;
  const pool = poolSize(), seen = pool - deck.length;
  $("#counter").textContent = top.length ? `${Math.min(seen + 1, pool)} / ${pool}` : `${pool} / ${pool}`;
}
function renderEmpty(){
  const e = document.createElement("div");
  e.className = "empty";
  const savedHere = ALLM.filter(m => matches(m) && favs.includes(m.id)).length;
  if (filters.include.length && !poolSize()){
    e.innerHTML = `<div class="big">🔍</div><h3>No meals use all of those</h3><p>Nothing in the cookbook has <b>${esc(filters.include.join(", "))}</b>${prefs.type !== "All" ? ` for ${prefs.type.toLowerCase()}` : ""}. Remove an ingredient, or build a new meal.</p>
      <div class="row-btns" style="justify-content:center"><button class="btn ghost" data-clear-inc="1">Clear ingredients</button><button class="btn" data-gen="1">✨ Build a meal</button></div>`;
  } else if (savedHere){
    e.innerHTML = `<div class="big">🏆</div><h3>You saved every meal here!</h3><p>All ${savedHere} meals in this filter are in your favorites. Try another filter, or build a brand-new meal.</p>
       <div class="row-btns" style="justify-content:center"><button class="btn" data-gen="1">✨ Build a meal</button><button class="btn ghost" data-all="1">Show all meals</button></div>`;
  } else {
    e.innerHTML = `<div class="big">🍽️</div><h3>No meals match</h3><p>Try a different filter, or check your foods-to-avoid list in Me → Goals.</p><button class="btn" data-all="1">Show all meals</button>`;
  }
  e.querySelector("[data-all]")?.addEventListener("click", () => { prefs.type = "All"; prefs.day = "all"; filters.include = []; saveFilters(); applyFilters(); });
  e.querySelector("[data-clear-inc]")?.addEventListener("click", () => { filters.include = []; saveFilters(); applyFilters(); });
  e.querySelector("[data-gen]")?.addEventListener("click", () => openGenerator());
  stack.appendChild(e);
}
const topCard = () => stack.querySelector(".card.pos-0:not(.leaving)");
function act(kind){
  if (busy || !deck.length) return;
  const id = deck[0], el = topCard();
  busy = true;
  deck.shift();
  if (kind === "save"){ favs = [id, ...favs.filter(x => x !== id)]; toast("❤️ Saved to favorites"); }
  else if (!skipped.includes(id)) skipped.push(id);
  history.push({id, kind});
  if (history.length > 30) history.shift();
  persist();
  if (el){
    el.classList.add("leaving");
    el.querySelector(".stamp." + kind).style.opacity = 1;
    const dir = kind === "save" ? 1 : -1;
    el.style.transition = "transform .4s cubic-bezier(.4,.1,.6,1), opacity .4s";
    el.style.transform = `translateX(${dir * 150}%) rotate(${dir * 22}deg)`;
    el.style.opacity = 0;
    setTimeout(() => el.remove(), 420);
  }
  ensureDeck(); renderStack(); updateBadge();
  setTimeout(() => busy = false, 260);
}
function undo(){
  const h = history.pop();
  if (!h || busy) return;
  if (h.kind === "save") favs = favs.filter(x => x !== h.id); else skipped = skipped.filter(x => x !== h.id);
  deck = [h.id, ...deck.filter(x => x !== h.id)];
  persist(); renderStack(); updateBadge();
  toast("↩️ Brought it back");
}
function flip(){ const el = topCard(); if (el) el.classList.toggle("flipped"); }
function attachDrag(el){
  let sx = 0, sy = 0, dx = 0, down = false, moved = false, pid = null;
  const stamps = () => [el.querySelector(".stamp.save"), el.querySelector(".stamp.skip")];
  const resetStamps = () => stamps().forEach(s => s.style.opacity = 0);
  el.addEventListener("pointerdown", e => {
    if (!el.classList.contains("pos-0") || el.classList.contains("leaving") || busy) return;
    if (e.target.closest("button")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    down = true; moved = false; dx = 0; sx = e.clientX; sy = e.clientY; pid = e.pointerId;
  });
  el.addEventListener("pointermove", e => {
    if (!down || e.pointerId !== pid) return;
    dx = e.clientX - sx; const dy = e.clientY - sy;
    if (!moved && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2){
      moved = true; el.style.transition = "none";
      try { el.setPointerCapture(pid); } catch(_){}
    }
    if (moved){
      el.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
      const [sv, sk] = stamps();
      sv.style.opacity = Math.max(0, Math.min(1, dx / 110));
      sk.style.opacity = Math.max(0, Math.min(1, -dx / 110));
    }
  });
  const end = (e, cancelled) => {
    if (!down) return; down = false;
    if (moved){
      el.style.transition = "";
      if (!cancelled && dx > 110) { el.style.transform = `translateX(${dx}px) rotate(${dx/20}deg)`; act("save"); }
      else if (!cancelled && dx < -110) { el.style.transform = `translateX(${dx}px) rotate(${dx/20}deg)`; act("skip"); }
      else { el.style.transform = ""; resetStamps(); }
    } else if (!cancelled && Math.abs(e.clientX - sx) < 8 && Math.abs(e.clientY - sy) < 8){
      flip();
    }
  };
  el.addEventListener("pointerup", e => end(e, false));
  el.addEventListener("pointercancel", e => end(e, true));
}

/* ---------- deck controls & ingredient filter ---------- */
const ING_CHIPS = ["Spicy","Baked chicken","Chicken","Turkey","Beef","Ground beef","Salmon","Shrimp","Eggs","Tofu","Greek yogurt","Rice","Potato","Pasta","Oats","Broccoli","Spinach","Beans","Avocado"];
function renderControls(){
  document.querySelectorAll("#daySeg button").forEach(b => b.classList.toggle("on", b.dataset.day === prefs.day));
  const n = filters.include.length;
  $("#typeChips").innerHTML = TYPES.map(t => `<button class="chip ${prefs.type === t ? "on" : ""}" data-type="${t}">${t === "All" ? "All meals" : t}</button>`).join("")
    + `<button class="chip ing ${n || ingOpen ? "on-ing" : ""}" id="ingToggle">🔍 Ingredients${n ? ` (${n})` : ""}</button>`;

      ${n ? `<div class="incl">${filters.include.map(t => `<button class="chip on" data-inc-rm="${esc(t)}">${esc(t)} ✕</button>`).join("")}<button class="linkish" data-inc-clear="1">Clear</button></div>` : ""}
      <div class="chips ingchips">${ING_CHIPS.filter(c => !filters.include.some(t => t.toLowerCase() === c.toLowerCase())).map(c => `<button class="chip" data-inc-add="${c}">+ ${c}</button>`).join("")}</div>
      <p class="gnote" style="padding:2px 2px 0">${n ? `<b>${poolSize()}</b> meals use ${n > 1 ? "all of these" : "it"}. ` : "Pick ingredients to find meals that use them. "}${ex.length ? `Avoiding: ${esc(ex.join(", "))} (edit in Me → Goals).` : ""}</p>`;
  }
}
function applyFilters(){ persist(); saveFilters(); history = []; renderControls(); buildDeck(); renderStack(true); }
$("#daySeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; prefs.day = b.dataset.day; applyFilters(); });
$("#typeChips").addEventListener("click", e => {
  if (e.target.closest("#ingToggle")){ ingOpen = !ingOpen; renderControls(); if (ingOpen) $("#ingInput")?.focus({preventScroll:true}); return; }
  const b = e.target.closest(".chip"); if (!b) return; prefs.type = b.dataset.type; applyFilters();
});
function addIncludes(str){
  str.split(/,|\band\b|\bwith\b/).map(s => s.trim().toLowerCase()).filter(s => s && s.length > 1 && !/^(what|can|i|make)$/.test(s))
    .forEach(t => { if (!filters.include.includes(t)) filters.include.push(t); });
}
$("#ingPanel").addEventListener("submit", e => { e.preventDefault(); const v = $("#ingInput").value; if (!v.trim()) return; addIncludes(v.replace(/what can i make with/i, "")); applyFilters(); });
$("#ingPanel").addEventListener("click", e => {
  const a = e.target.closest("[data-inc-add]"), r = e.target.closest("[data-inc-rm]"), c = e.target.closest("[data-inc-clear]");
  if (a){ addIncludes(a.dataset.incAdd); applyFilters(); }
  else if (r){ filters.include = filters.include.filter(t => t !== r.dataset.incRm); applyFilters(); }
  else if (c){ filters.include = []; applyFilters(); }
});
$("#skipBtn").onclick = () => act("skip");
$("#saveBtn").onclick = () => act("save");
$("#flipBtn").onclick = flip;
$("#planBtn").onclick = () => { const el = topCard(); if (el && byId[el.dataset.id]) openPlanPicker(el.dataset.id); };
$("#undoBtn").onclick = undo;


/* ---------- sheets (modal) ---------- */
function openSheet(html, tc){
  const s = $("#sheet");
  s.style.setProperty("--tc", tc || "var(--accent)");
  s.innerHTML = html;
  s.querySelector(".close")?.addEventListener("click", closeModal);
  $("#modal").classList.add("open"); $("#modal").setAttribute("aria-hidden","false");

function closeModal(){ $("#modal").classList.remove("open"); $("#modal").setAttribute("aria-hidden","true"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
function openModal(m, extra){

function toggleFav(id){
  if (favs.includes(id)){
    favs = favs.filter(x => x !== id);
    if (matches(byId[id]) && !deck.includes(id)) deck.push(id);
    toast("Removed from favorites");
  } else { favs = [id, ...favs]; deck = deck.filter(x => x !== id); toast("❤️ Saved to favorites"); }
  persist(); updateBadge(); renderStack();
  if (currentView === "me") renderMe();
}

/* ---------- tracker logging ---------- */
const todayLog = () => logData[dateKey()] || [];
function logEntry(e){ const k = dateKey(); (logData[k] = logData[k] || []).push(Object.assign({t: Date.now()}, e)); saveLog(); }
function totalsFor(key){ return (logData[key] || []).reduce((a, e) => ({p: a.p + e.p, kcal: a.kcal + e.kcal}), {p:0, kcal:0}); }

}
function reconcilePlan(){
  if (!plan || !plan.days) return;
  plan.days.forEach((d, i) => { if (d.slots.some(s => !s.lock && (!byId[s.id] || isExcluded(byId[s.id])))) fillDay(i); });
  savePlan();
}
function filtersChanged(){
  saveFilters(); weightCache = null; buildDeck(); renderControls(); renderStack(true); reconcilePlan();
  const n = $("#exclNote"); if (n) n.textContent = `${ALLM.filter(m => !isExcluded(m)).length} of ${ALLM.length} meals fit your list.`;
}
$("#meSeg").addEventListener("click", e => { const b = e.target.closest("[data-me]"); if (!b) return; meTab = b.dataset.me; $("#meScroll").scrollTop = 0; renderMe(); });
$("#meBody").addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-act]")) return;
  const go = t.closest("[data-go]"), ft = t.closest("[data-ftype]"), op = t.closest("[data-open]"), rm = t.closest("[data-remove]"), rl = t.closest("[data-rmlog]"), ex = t.closest("[data-excl]");
  if (go) return showView(go.dataset.go);
  if (ft){ favType = ft.dataset.ftype; return renderMe(); }
  if (op) return openModal(byId[op.dataset.open]);
  if (rm) return toggleFav(rm.dataset.remove);
  if (rl){ const k = dateKey(); logData[k].splice(+rl.dataset.rmlog, 1); saveLog(); toast("Entry deleted"); return renderMe(); }
  const md = t.closest("[data-mode]");
  if (md){
    goals.mode = md.dataset.mode; LS.set("mealdeck.goals", goals);
    document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b === md));
    $("#goalStats").innerHTML = goalStatsHtml();
    if (plan && plan.days){ plan.days.forEach((_, i) => balanceDay(i)); savePlan(); }
    const T = targets(); return toast(`${GOAL_MODES[T.mode].short}: ${T.kTrain.toLocaleString()} / ${T.kRest.toLocaleString()} kcal`);
  }
  if (ex){ const k = ex.dataset.excl; filters.exclude = filters.exclude.includes(k) ? filters.exclude.filter(x => x !== k) : [...filters.exclude, k]; ex.classList.toggle("on"); filtersChanged(); return; }
  if (t.closest("#resetSkipped")){ const n = skipped.length; skipped = []; persist(); buildDeck(); renderStack(true); renderMe(); return toast(n ? `🔄 ${n} skipped meal${n > 1 ? "s" : ""} back in the deck` : "No skipped meals to bring back"); }
  if (t.closest("#clearFavs")){ if (!favs.length) return toast("No favorites to clear"); if (!confirm("Remove all saved favorites?")) return; favs = []; persist(); updateBadge(); buildDeck(); renderStack(true); renderMe(); return toast("Favorites cleared"); }
});
$("#meBody").addEventListener("input", e => {
  if (e.target.id === "wIn" || e.target.id === "gIn"){
    goals.weight = $("#wIn").value; goals.goal = $("#gIn").value; LS.set("mealdeck.goals", goals);
    $("#goalStats").innerHTML = goalStatsHtml();
    if (plan && plan.days){ plan.days.forEach((_, i) => balanceDay(i)); savePlan(); }
    stack.querySelectorAll(".card").forEach(c => c.remove()); renderStack();
  }
});
$("#meBody").addEventListener("change", e => { if (e.target.id === "avIn"){ filters.avoid = e.target.value; filtersChanged(); toast("Avoid list updated"); } });
$("#meBody").addEventListener("submit", e => {
  e.preventDefault(); if (e.target.id !== "qForm") return;
  const p = Math.max(0, Math.round(+$("#qP").value || 0)), k = Math.max(0, Math.round(+$("#qK").value || 0));
  if (!p && !k) return toast("Enter protein or calories");
  logEntry({id: null, name: $("#qName").value.trim() || "Quick add", emoji: "➕", n: 1, p, kcal: k});
  toast(`✓ Added ${p} g protein`); renderMe();
});

/* ---------- views, keys, init ---------- */
let currentView = "deck";
function updateBadge(){ $("#favBadge").textContent = favs.length || ""; }
function showView(v){
  if (v === "favs" || v === "goals"){ meTab = v; v = "me"; }
  currentView = v;
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("active", x.id === "view-" + v));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  if (v === "plan") renderPlan();
  if (v === "grocery") renderGrocery();
  if (v === "me") renderMe();
  $("#hdrDeck").style.visibility = v === "deck" ? "visible" : "hidden";
}
document.querySelector("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) showView(b.dataset.view); });
$("#genBtn").onclick = openGenerator;
document.addEventListener("keydown", e => {
  if ($("#modal").classList.contains("open")){ if (e.key === "Escape") closeModal(); return; }
  if (currentView !== "deck" || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft"){ e.preventDefault(); act("skip"); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); act("save"); }
  else if (e.key === " " || e.key === "Enter"){ if (document.activeElement.tagName === "BUTTON" && e.key === "Enter") return; e.preventDefault(); flip(); }
  else if (e.key.toLowerCase() === "u") undo();
});
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

renderControls(); buildDeck(); renderStack(true); updateBadge(); ensurePlan();
if (rebalanceAll && plan && plan.days){ plan.days.forEach((_, i) => balanceDay(i)); savePlan(); }

/* ---------- offline / install (only when served over http(s); harmless when opened as a file) ---------- */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
